        function menuButtons() {
          return [
            {
              label: "Iniciar Jogo",
              action: () => {
                ui.selected = 0;
                startGame();
              },
            },
            {
              label: "Configurações",
              action: () => {
                ui.selected = 0;
                game.screen = Screens.SETTINGS;
              },
            },
            {
              label: "Ranking",
              action: () => {
                ui.selected = 0;
                game.screen = Screens.RANKING;
              },
            },
            {
              label: "Sair",
              action: () => {
                stopMusic();
                window.location.assign(HOME_URL);
              },
            },
          ];
        }

        function menuButtonIndexAt(x, y) {
          const buttons = menuButtons();
          const bw = Math.min(520, canvas.width * 0.55);
          const bh = 52;
          const gap = 14;
          const left = canvas.width / 2 - bw / 2;
          const top = canvas.height * 0.48;

          for (let i = 0; i < buttons.length; i++) {
            const buttonTop = top + i * (bh + gap);
            const isInside =
              x >= left &&
              x <= left + bw &&
              y >= buttonTop &&
              y <= buttonTop + bh;

            if (isInside) return i;
          }

          return -1;
        }

        function settingsItems() {
          return [
            {
              label: "Áudio",
              type: "toggle",
              valueText: () => (settings.audioOn ? "Ligado" : "Desligado"),
              toggle: () => {
                settings.audioOn = !settings.audioOn;
                persistSettings();
                initAudio();
                toggleAudio(settings.audioOn);
                if (settings.audioOn) startMusic();
                else stopMusic();
              },
            },
            {
              label: "Volume Música",
              type: "slider",
              get: () => settings.musicVol,
              set: (v) => {
                settings.musicVol = clamp(v, 0, 1);
                persistSettings();
                if (audio) setVolumes(settings.musicVol, settings.sfxVol);
              },
              valueText: () => `${Math.round(settings.musicVol * 100)}%`,
            },
            {
              label: "Volume Efeitos",
              type: "slider",
              get: () => settings.sfxVol,
              set: (v) => {
                settings.sfxVol = clamp(v, 0, 1);
                persistSettings();
                if (audio) setVolumes(settings.musicVol, settings.sfxVol);
              },
              valueText: () => `${Math.round(settings.sfxVol * 100)}%`,
            },
            {
              label: "Dificuldade",
              type: "cycle",
              valueText: () => settings.difficulty,
              toggle: () => {
                const opts = ["Fácil", "Normal", "Difícil"];
                const i = opts.indexOf(settings.difficulty);
                settings.difficulty = opts[(i + 1) % opts.length];
                persistSettings();
              },
            },
            {
              label: "Mostrar Dicas (HUD)",
              type: "toggle",
              valueText: () => (settings.showHint ? "Sim" : "Não"),
              toggle: () => {
                settings.showHint = !settings.showHint;
                persistSettings();
                hintEl.style.display = settings.showHint ? "block" : "none";
              },
            },
            {
              label: "Voltar",
              type: "button",
              valueText: () => "Esc",
              toggle: () => {
                ui.selected = 0;
                game.screen = Screens.MENU;
              },
            },
          ];
        }

        const ui = { selected: 0 };

        // --------------------------------------------
        // Game flow
        // --------------------------------------------
        function startGame() {
          resetPlaySession();
          game.screen = Screens.PLAY;
          ui.selected = 0;
        }

        function gameOver() {
          addScoreToRanking(Math.floor(game.score));
          game.screen = Screens.GAMEOVER;
          ui.selected = 0;
        }

        function victory() {
          addScoreToRanking(Math.floor(game.score));
          game.screen = Screens.VICTORY;
          ui.selected = 0;
          game.cutsceneT = 0;
        }

        // --------------------------------------------
        // Update loop
        // --------------------------------------------
        function tick() {
          const t = now();
          game.dt = Math.min(0.033, (t - game.last) / 1000);
          game.last = t;
          game.t += game.dt;

          // global UI corner status
          miniStatus.innerHTML = [
            `<b>Elite Star Defender</b>`,
            `Tela: ${game.screen.toUpperCase()}`,
            `Áudio: ${settings.audioOn ? "ON" : "OFF"}`,
          ].join("<br>");

          // music intensity follows difficulty and threats
          if (audio) {
            const threat = clamp(
              game.wave / 18 +
                game.timeSurvived / 240 +
                (game.finalBossSpawned ? 0.35 : 0),
              0,
              1,
            );
            audio.intensity = clamp(threat, 0, 1);
            updateMusic(game.dt);
          }

          updateInput();
          updateScreen();
          renderScreen();

          requestAnimationFrame(tick);
        }

        function updateInput() {
          // Ensure audio context resumes on first user interaction
          if (settings.audioOn && audio && audio.ctx.state === "suspended") {
            if (keys.size > 0) audio.ctx.resume().catch(() => {});
          }
        }

        function updateScreen() {
          const clicked = pointer.clicked;
          pointer.clicked = false;

          if (game.screen !== Screens.MENU) {
            canvas.style.cursor = "default";
          }

          if (game.screen === Screens.MENU) {
            const buttons = menuButtons();
            const hoveredIndex = menuButtonIndexAt(pointer.x, pointer.y);

            if (hoveredIndex >= 0) {
              ui.selected = hoveredIndex;
              canvas.style.cursor = "pointer";
            } else {
              canvas.style.cursor = "default";
            }

            if (keyPressed("arrowdown") || keyPressed("s"))
              ui.selected = (ui.selected + 1) % buttons.length;
            if (keyPressed("arrowup") || keyPressed("w"))
              ui.selected = (ui.selected - 1 + buttons.length) % buttons.length;
            if (keyPressed("enter") || (clicked && hoveredIndex >= 0)) {
              initAudio();
              buttons[ui.selected].action();
              beep({ freq: 520, dur: 0.05, gain: 0.02, type: "triangle" });
            }
          } else if (game.screen === Screens.SETTINGS) {
            const items = settingsItems();
            if (keyPressed("arrowdown") || keyPressed("s"))
              ui.selected = (ui.selected + 1) % items.length;
            if (keyPressed("arrowup") || keyPressed("w"))
              ui.selected = (ui.selected - 1 + items.length) % items.length;

            const it = items[ui.selected];
            if (keyPressed("escape")) {
              ui.selected = 0;
              game.screen = Screens.MENU;
              beep({ freq: 440, dur: 0.04, gain: 0.02, type: "triangle" });
            }
            if (keyPressed("enter")) {
              it.toggle?.();
              beep({ freq: 520, dur: 0.05, gain: 0.02, type: "triangle" });
            }
            if (it.type === "slider") {
              if (keyDown("arrowleft") || keyDown("a"))
                it.set(it.get() - game.dt * 0.6);
              if (keyDown("arrowright") || keyDown("d"))
                it.set(it.get() + game.dt * 0.6);
            } else {
              if (
                keyPressed("arrowleft") ||
                keyPressed("arrowright") ||
                keyPressed("a") ||
                keyPressed("d")
              ) {
                it.toggle?.();
                beep({ freq: 520, dur: 0.05, gain: 0.02, type: "triangle" });
              }
            }
          } else if (game.screen === Screens.RANKING) {
            if (keyPressed("escape")) {
              ui.selected = 0;
              game.screen = Screens.MENU;
              beep({ freq: 440, dur: 0.04, gain: 0.02, type: "triangle" });
            }
            if (keyPressed("delete") || keyPressed("backspace")) {
              saveRanking([]);
              beep({ freq: 280, dur: 0.08, gain: 0.02, type: "square" });
            }
          } else if (game.screen === Screens.PLAY) {
            if (keyPressed("p")) {
              game.screen = Screens.PAUSE;
              beep({ freq: 420, dur: 0.05, gain: 0.02, type: "triangle" });
            }
            if (keyPressed("escape")) {
              stopMusic();
              game.screen = Screens.MENU;
              ui.selected = 0;
              beep({ freq: 340, dur: 0.06, gain: 0.02, type: "triangle" });
            }
            updatePlay(game.dt);
          } else if (game.screen === Screens.PAUSE) {
            if (keyPressed("p")) {
              game.screen = Screens.PLAY;
              beep({ freq: 520, dur: 0.05, gain: 0.02, type: "triangle" });
            }
            if (keyPressed("escape")) {
              stopMusic();
              game.screen = Screens.MENU;
              ui.selected = 0;
              beep({ freq: 340, dur: 0.06, gain: 0.02, type: "triangle" });
            }
          } else if (game.screen === Screens.GAMEOVER) {
            const opts = 2;
            if (keyPressed("arrowdown") || keyPressed("s"))
              ui.selected = (ui.selected + 1) % opts;
            if (keyPressed("arrowup") || keyPressed("w"))
              ui.selected = (ui.selected - 1 + opts) % opts;
            if (keyPressed("enter")) {
              beep({ freq: 520, dur: 0.05, gain: 0.02, type: "triangle" });
              if (ui.selected === 0) {
                startGame();
              } else {
                stopMusic();
                game.screen = Screens.MENU;
                ui.selected = 0;
              }
            }
            if (keyPressed("escape")) {
              stopMusic();
              game.screen = Screens.MENU;
              ui.selected = 0;
            }
          } else if (game.screen === Screens.VICTORY) {
            game.cutsceneT += game.dt;
            if (keyPressed("enter")) {
              // restart with increased difficulty (loop)
              game.loopLevel += 1;
              startGame();
            }
            if (keyPressed("escape")) {
              stopMusic();
              game.screen = Screens.MENU;
              ui.selected = 0;
            }
          }
        }

        function renderScreen() {
          clear();
          if (game.screen === Screens.MENU) drawMenu();
          else if (game.screen === Screens.SETTINGS) drawSettings();
          else if (game.screen === Screens.RANKING) drawRanking();
          else if (game.screen === Screens.PLAY) drawPlay();
          else if (game.screen === Screens.PAUSE) drawPause();
          else if (game.screen === Screens.GAMEOVER) drawGameOver();
          else if (game.screen === Screens.VICTORY) drawVictory();
        }

        // --------------------------------------------
        // Play update & render
        // --------------------------------------------
        function updatePlay(dt) {
          const p = game.player;
          if (!p) return;

          // time / difficulty
          game.timeSurvived += dt;
          game.difficultyTimer += dt;
          game.stageProgress = Math.floor(game.timeSurvived / 45); // background shift every 45s

          // Every 60s increase difficulty: spawn more stuff + speed
          if (game.difficultyTimer >= 60) {
            game.difficultyTimer = 0;
            // small reward: weapon level bump sometimes
            if (p.weaponLevel < 5 && Math.random() < 0.6) p.weaponLevel++;
            beep({ freq: 620, dur: 0.1, gain: 0.02, type: "triangle" });
          }

          // Waves: spawn when low threats or timer
          game.waveTimer += dt;
          const threats = game.enemies.length + game.asteroids.length;
          if (threats < 4 && game.waveTimer > 1.2) {
            game.waveTimer = 0;
            spawnWave(game.wave);
            game.wave++;
          }

          // Final boss condition (Confronto Final)
          // Survive long enough + score high
          if (
            !game.finalBossSpawned &&
            game.timeSurvived > 180 &&
            game.score >= 1800
          ) {
            game.finalBossSpawned = true;
            game.enemies.push(makeFinalBoss(1 + game.loopLevel * 0.25));
            // boss warning sound
            for (let i = 0; i < 3; i++)
              beep({ freq: 110, dur: 0.18, gain: 0.06, type: "sawtooth" });
          }

          // player movement
          const accel = 1400 * p.speed;
          let ax = 0,
            ay = 0;
          if (keyDown("arrowleft") || keyDown("a")) ax -= 1;
          if (keyDown("arrowright") || keyDown("d")) ax += 1;
          if (keyDown("arrowup") || keyDown("w")) ay -= 1;
          if (keyDown("arrowdown") || keyDown("s")) ay += 1;
          const len = Math.hypot(ax, ay) || 1;
          ax = (ax / len) * accel;
          ay = (ay / len) * accel;

          p.vx = lerp(p.vx, ax, 0.12);
          p.vy = lerp(p.vy, ay, 0.12);
          p.x += p.vx * dt;
          p.y += p.vy * dt;

          // bounds
          p.x = clamp(p.x, 26, canvas.width - 26);
          p.y = clamp(p.y, 26, canvas.height - 26);

          // Power timers
          p.doubleShotT = Math.max(0, p.doubleShotT - dt);
          p.homingMissilesT = Math.max(0, p.homingMissilesT - dt);
          p.superLaserT = Math.max(0, p.superLaserT - dt);

          // Shield
          p.shieldCd = Math.max(0, p.shieldCd - dt);
          if (
            (keyDown("shift") ||
              keyDown("shiftleft") ||
              keyDown("shiftright")) &&
            p.shieldCd <= 0 &&
            p.shieldT > 0
          ) {
            p.shieldActive = true;
          } else if (
            !keyDown("shift") &&
            !keyDown("shiftleft") &&
            !keyDown("shiftright")
          ) {
            p.shieldActive = false;
          }
          if (p.shieldActive) {
            p.shieldT = Math.max(0, p.shieldT - dt);
            if (p.shieldT <= 0) {
              p.shieldActive = false;
              p.shieldCd = 1.4;
            }
          }

          // Super laser (space)
          p.superLaserCd = Math.max(0, p.superLaserCd - dt);
          if (
            keyPressed(" ") &&
            p.superLaserCd <= 0 &&
            p.superLaserT > 0 &&
            !p.superLaserActive
          ) {
            p.superLaserActive = true;
            p.superLaserBeamT = 0.22;
            p.superLaserCd = 4.5;
            // zap sound
            beep({ freq: 780, dur: 0.12, gain: 0.03, type: "triangle" });
            noiseBurst({ dur: 0.12, gain: 0.03, hp: 450 });
          }
          if (p.superLaserActive) {
            p.superLaserBeamT -= dt;
            if (p.superLaserBeamT <= 0) {
              p.superLaserActive = false;
            } else {
              // beam damage ticks
              const beamHalf = 14;
              const beamX = p.x;
              for (const e of game.enemies) {
                if (Math.abs(e.x - beamX) < e.r + beamHalf && e.y < p.y) {
                  damageEntity(e, 85 * p.damage * dt);
                }
              }
              for (const a of game.asteroids) {
                if (Math.abs(a.x - beamX) < a.r + beamHalf && a.y < p.y) {
                  a.hp -= 70 * p.damage * dt;
                }
              }
            }
          }

          // Auto-fire player bullets
          firePlayerShots(dt);

          // Update drones (allies)
          updateDrones(dt);

          // Update bullets
          updateBullets(dt);

          // Update enemies/asteroids
          updateEnemies(dt);
          updateAsteroids(dt);

          // Update powerups / barriers / explosions / background
          updatePowerups(dt);
          updateBarriers(dt);
          updateExplosions(dt);

          // Random meteor events creating barriers (temporary)
          if (Math.random() < dt * (0.06 + game.stageProgress * 0.01)) {
            spawnBarrier(
              rand(40, canvas.width - 40),
              rand(canvas.height * 0.15, canvas.height * 0.7),
            );
          }

          // Check lose
          if (p.hp <= 0) {
            stopMusic();
            gameOver();
          }

          // Check victory if final boss defeated
          if (game.finalBossSpawned && game.finalBossDefeated) {
            stopMusic();
            victory();
          }
        }

        function updateDrones(dt) {
          const p = game.player;
          // Keep 0..2 drones; drone powerups add or refresh
          for (const d of game.drones) {
            d.t += dt;
            const idx = d.idx;
            const targetX =
              p.x + (idx === 0 ? -46 : 46) + Math.sin(d.t * 2.4 + idx) * 6;
            const targetY = p.y - 8 + Math.cos(d.t * 2.0 + idx) * 5;
            d.x = lerp(d.x, targetX, 0.12);
            d.y = lerp(d.y, targetY, 0.12);

            // drone firing
            d.fireCd -= dt;
            if (d.fireCd <= 0) {
              d.fireCd = 0.38;
              const target = findNearestTarget(d.x, d.y);
              if (target) {
                const dx = target.x - d.x;
                const dy = target.y - d.y;
                const L = Math.hypot(dx, dy) || 1;
                const spd = 820;
                game.bullets.push({
                  type: "droneShot",
                  x: d.x,
                  y: d.y,
                  vx: (dx / L) * spd,
                  vy: (dy / L) * spd,
                  r: 3.5,
                  dmg: 10 * p.damage,
                  ttl: 1.2,
                  t: 0,
                });
                beep({ freq: 640, dur: 0.03, gain: 0.012, type: "triangle" });
              }
            }
          }
        }

        function updateBullets(dt) {
          // player bullets
          for (let i = game.bullets.length - 1; i >= 0; i--) {
            const b = game.bullets[i];
            b.t += dt;
            if (b.type === "missile") {
              // home toward nearest
              let target = null;
              if (b.targetId) {
                target =
                  [...game.enemies, ...game.asteroids].find(
                    (x) => x._id === b.targetId,
                  ) || null;
              }
              if (!target) {
                target = findNearestTarget(b.x, b.y);
                if (target) b.targetId = ensureId(target);
              }
              if (target) {
                const dx = target.x - b.x;
                const dy = target.y - b.y;
                const L = Math.hypot(dx, dy) || 1;
                const desiredVx = (dx / L) * 620;
                const desiredVy = (dy / L) * 620;
                b.vx = lerp(b.vx, desiredVx, clamp(dt * b.turnRate, 0, 1));
                b.vy = lerp(b.vy, desiredVy, clamp(dt * b.turnRate, 0, 1));
              }
            }

            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.ttl -= dt;

            if (
              b.ttl <= 0 ||
              b.y < -2000 ||
              b.y > canvas.height + 2000 ||
              b.x < -800 ||
              b.x > canvas.width + 800
            ) {
              game.bullets.splice(i, 1);
              continue;
            }

            // collision with enemies/asteroids
            let hit = false;
            for (let j = game.enemies.length - 1; j >= 0; j--) {
              const e = game.enemies[j];
              if (circleHit(b.x, b.y, b.r, e.x, e.y, e.r)) {
                hit = true;
                damageEntity(e, b.dmg);
                spawnExplosion(b.x, b.y, 0.55);
                if (e.hp <= 0) {
                  // final boss?
                  if (e.type === "finalBoss") {
                    game.finalBossDefeated = true;
                    awardPoints(5000);
                    spawnExplosion(e.x, e.y, 3.2);
                  } else {
                    awardPoints(e.score);
                    if (Math.random() < 0.22) spawnPowerup(e.x, e.y);
                    spawnExplosion(e.x, e.y, e.type === "boss" ? 2.0 : 1.0);
                  }
                  game.enemies.splice(j, 1);
                }
                break;
              }
            }
            if (hit) {
              game.bullets.splice(i, 1);
              continue;
            }

            for (let j = game.asteroids.length - 1; j >= 0; j--) {
              const a = game.asteroids[j];
              if (circleHit(b.x, b.y, b.r, a.x, a.y, a.r)) {
                a.hp -= b.dmg;
                spawnExplosion(b.x, b.y, 0.5);
                if (a.hp <= 0) {
                  awardPoints(a.score);
                  if (Math.random() < 0.18) spawnPowerup(a.x, a.y);
                  spawnExplosion(a.x, a.y, a.kind === "giant" ? 1.4 : 1.0);

                  // giant splits
                  if (a.kind === "giant" && a.splits > 0) {
                    for (let k = 0; k < a.splits; k++) {
                      const child = makeAsteroid("small", 1);
                      child.x = a.x + rand(-18, 18);
                      child.y = a.y + rand(-18, 18);
                      child.vx = rand(-140, 140);
                      child.vy = rand(160, 260);
                      game.asteroids.push(child);
                    }
                  }
                  // sometimes barrier appears from explosion
                  if (Math.random() < 0.25) spawnBarrier(a.x, a.y);
                  game.asteroids.splice(j, 1);
                }
                game.bullets.splice(i, 1);
                hit = true;
                break;
              }
            }
            if (hit) continue;
          }

          // enemy bullets
          for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
            const b = game.enemyBullets[i];
            b.t += dt;
            b.ttl -= dt;

            // homing orb
            if (b.type === "homingOrb") {
              const p = game.player;
              const dx = p.x - b.x;
              const dy = p.y - b.y;
              const L = Math.hypot(dx, dy) || 1;
              const desiredVx = (dx / L) * 240;
              const desiredVy = (dy / L) * 240;
              b.vx = lerp(b.vx, desiredVx, clamp(dt * b.turnRate, 0, 1));
              b.vy = lerp(b.vy, desiredVy, clamp(dt * b.turnRate, 0, 1));
            }

            b.x += b.vx * dt;
            b.y += b.vy * dt;

            if (
              b.ttl <= 0 ||
              b.y > canvas.height + 200 ||
              b.x < -200 ||
              b.x > canvas.width + 200
            ) {
              game.enemyBullets.splice(i, 1);
              continue;
            }

            // collision with player
            const p = game.player;
            if (circleHit(b.x, b.y, b.r, p.x, p.y, p.r)) {
              applyPlayerDamage(b.dmg);
              spawnExplosion(b.x, b.y, 0.6);
              game.enemyBullets.splice(i, 1);
            }
          }
        }

        function updateEnemies(dt) {
          const p = game.player;

          for (let i = game.enemies.length - 1; i >= 0; i--) {
            const e = game.enemies[i];
            ensureId(e);

            // movement
            if (e.type === "enemy") {
              e.x += e.vx * dt;
              e.y += e.vy * dt;

              // drift/zigzag
              e.vx += Math.sin((game.t * 1.6 + e._id) * 0.9) * 18 * dt;
              e.vx = clamp(e.vx, -160, 160);

              // shoot
              e.fireCd -= dt;
              if (e.fireCd <= 0 && e.y > 40) {
                e.fireCd = e.fireRate;
                fireEnemy(e);
              }

              // despawn if off screen
              if (e.y > canvas.height + 160) {
                game.enemies.splice(i, 1);
                continue;
              }

              // collision with player
              if (circleHit(e.x, e.y, e.r, p.x, p.y, p.r)) {
                applyPlayerDamage(e.dmg * 1.2);
                spawnExplosion(e.x, e.y, 1.2);
                // enemy destroyed on collision
                awardPoints(Math.floor(e.score * 0.4));
                game.enemies.splice(i, 1);
              }
            } else if (e.type === "boss") {
              e.t += dt;
              // enter then hover
              if (e.y < canvas.height * 0.22) e.y += e.vy * dt;
              else e.y += Math.sin(e.t * 0.9) * 16 * dt;
              e.x += Math.sin(e.t * 0.8) * 50 * dt;

              e.x = clamp(e.x, e.r + 20, canvas.width - e.r - 20);

              fireBoss(e, dt);

              // player collision
              if (circleHit(e.x, e.y, e.r, p.x, p.y, p.r)) {
                applyPlayerDamage(42);
              }

              // boss death handled in bullet loop; but in case laser killed
              if (e.hp <= 0) {
                awardPoints(e.score);
                if (Math.random() < 0.6) spawnPowerup(e.x, e.y);
                spawnExplosion(e.x, e.y, 2.2);
                game.enemies.splice(i, 1);
              }
            } else if (e.type === "finalBoss") {
              e.t += dt;
              // enter then hover
              if (e.y < canvas.height * 0.18) e.y += e.vy * dt;
              else e.y += Math.sin(e.t * 0.8) * 10 * dt;
              e.x += Math.sin(e.t * 0.6) * 46 * dt;
              e.x = clamp(e.x, e.r + 20, canvas.width - e.r - 20);

              fireFinalBoss(e, dt);

              // collision with player is brutal
              if (circleHit(e.x, e.y, e.r, p.x, p.y, p.r)) {
                applyPlayerDamage(72);
              }

              if (e.hp <= 0) {
                // handled as victory elsewhere, but keep safe
                game.finalBossDefeated = true;
                game.enemies.splice(i, 1);
              }
            }
          }
        }

        function updateAsteroids(dt) {
          const p = game.player;

          for (let i = game.asteroids.length - 1; i >= 0; i--) {
            const a = game.asteroids[i];
            ensureId(a);

            a.x += a.vx * dt;
            a.y += a.vy * dt;
            a.rot += a.spin * dt;

            // wrap horizontally a bit
            if (a.x < -80) a.x = canvas.width + 80;
            if (a.x > canvas.width + 80) a.x = -80;

            // off screen
            if (a.y > canvas.height + 200) {
              game.asteroids.splice(i, 1);
              continue;
            }

            // collision with player
            if (circleHit(a.x, a.y, a.r, p.x, p.y, p.r)) {
              applyPlayerDamage(a.dmg);
              spawnExplosion(a.x, a.y, a.kind === "giant" ? 1.8 : 1.2);
              // asteroid breaks
              if (a.kind === "giant" && a.splits > 0) {
                for (let k = 0; k < a.splits; k++) {
                  const child = makeAsteroid("small", 1);
                  child.x = a.x + rand(-18, 18);
                  child.y = a.y + rand(-18, 18);
                  child.vx = rand(-160, 160);
                  child.vy = rand(160, 280);
                  game.asteroids.push(child);
                }
              }
              game.asteroids.splice(i, 1);
            }
          }
        }

        function updatePowerups(dt) {
          const p = game.player;
          for (let i = game.powerups.length - 1; i >= 0; i--) {
            const pu = game.powerups[i];
            pu.t += dt;
            pu.x += pu.vx * dt;
            pu.y += pu.vy * dt;

            // gentle drag
            pu.vx *= 1 - dt * 0.4;

            if (pu.y > canvas.height + 120) {
              game.powerups.splice(i, 1);
              continue;
            }

            if (circleHit(pu.x, pu.y, pu.r, p.x, p.y, p.r)) {
              // collect
              applyPowerup(pu.kind);
              game.powerups.splice(i, 1);
              // pickup sound
              beep({ freq: 740, dur: 0.07, gain: 0.02, type: "triangle" });
              noiseBurst({ dur: 0.04, gain: 0.015, hp: 600 });
            }
          }
        }

        function applyPowerup(kind) {
          const p = game.player;
          if (kind === "double") {
            p.doubleShotT = 12;
            p.weaponLevel = clamp(p.weaponLevel + 1, 1, 6);
          } else if (kind === "missiles") {
            p.homingMissilesT = 14;
          } else if (kind === "laser") {
            p.superLaserT = 16;
          } else if (kind === "shield") {
            p.shieldT = Math.max(p.shieldT, 4.0);
            p.shieldCd = 0;
          } else if (kind === "repair") {
            p.hp = Math.min(p.hpMax, p.hp + p.hpMax * 0.26);
          } else if (kind === "drone") {
            // add up to 2 drones
            if (game.drones.length < 2) {
              const idx = game.drones.length;
              game.drones.push({ x: p.x, y: p.y, idx, t: 0, fireCd: 0.2 });
            } else {
              // refresh drones firing
              for (const d of game.drones) d.fireCd = Math.min(d.fireCd, 0.15);
            }
          }
        }

        function updateBarriers(dt) {
          const p = game.player;
          for (let i = game.barriers.length - 1; i >= 0; i--) {
            const b = game.barriers[i];
            b.t += dt;
            if (b.t >= b.ttl) {
              game.barriers.splice(i, 1);
              continue;
            }
            // touching barrier hurts lightly (unless shield)
            if (circleHit(b.x, b.y, b.r, p.x, p.y, p.r)) {
              applyPlayerDamage(12 * dt * 60); // scaled
            }
          }
        }

        function updateExplosions(dt) {
          for (let i = game.explosions.length - 1; i >= 0; i--) {
            const ex = game.explosions[i];
            ex.t += dt;
            if (ex.t >= ex.ttl) game.explosions.splice(i, 1);
          }
        }

        function drawPlay() {
          // background changes with progress
          drawStars(game.dt);
          drawNebulas(game.dt);

          // stage tint overlay
          ctx.save();
          const phase = game.stageProgress % 4;
          const tint =
            phase === 0
              ? "rgba(53,211,255,.03)"
              : phase === 1
                ? "rgba(255,79,216,.03)"
                : phase === 2
                  ? "rgba(255,207,74,.03)"
                  : "rgba(77,255,136,.03)";
          ctx.fillStyle = tint;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.restore();

          // Entities
          for (const b of game.barriers) drawBarrier(b);
          for (const a of game.asteroids) drawAsteroid(a);
          for (const e of game.enemies) drawEnemy(e);

          // bullets
          for (const b of game.bullets) drawBullet(b);
          for (const b of game.enemyBullets) drawEnemyBullet(b);

          // super laser beam on top
          drawSuperLaser();

          // powerups
          for (const pu of game.powerups) drawPowerup(pu);

          // explosions
          for (const ex of game.explosions) drawExplosion(ex);

          // allies
          drawDrones();

          // player
          drawPlayer();

          // visibility reduction overlay
          drawOverlayVisibility();

          // HUD
          drawHUD();
        }

        // --------------------------------------------
        // Tiny UI logic / tool polyfill
        // --------------------------------------------
        // Canvas roundRect polyfill for older browsers
        if (!CanvasRenderingContext2D.prototype.roundRect) {
          CanvasRenderingContext2D.prototype.roundRect = function (
            x,
            y,
            w,
            h,
            r,
          ) {
            const rr = Math.min(r, w / 2, h / 2);
            this.beginPath();
            this.moveTo(x + rr, y);
            this.arcTo(x + w, y, x + w, y + h, rr);
            this.arcTo(x + w, y + h, x, y + h, rr);
            this.arcTo(x, y + h, x, y, rr);
            this.arcTo(x, y, x + w, y, rr);
            this.closePath();
            return this;
          };
        }

        // --------------------------------------------
        // Boot
        // --------------------------------------------
        // Start in menu
        game.screen = Screens.MENU;
        ui.selected = 0;

        // If hint disabled in saved settings
        hintEl.style.display = settings.showHint ? "block" : "none";

        // Kick loop
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
